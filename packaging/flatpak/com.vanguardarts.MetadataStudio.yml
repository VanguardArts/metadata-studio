# Flatpak manifest for Metadata Studio.
#
# A pure-Python app with PySide6. We use the KDE runtime (which ships Qt) and
# install our Python dependencies from the org.freedesktop.Sdk Python
# extensions rather than pip, so no network is needed at build time beyond the
# declared sources.
app-id: com.vanguardarts.MetadataStudio
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: metadata-studio-gui
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network

add-extensions:
  org.freedesktop.Sdk.Extension.python3:
    directory: lib/python3
    version: '3.12'
    add-ld-path: lib

build-options:
  append-path: /usr/lib/sdk/python3/bin

modules:
  - name: metadata-studio
    buildsystem: simple
    build-commands:
      - python3 -m pip install --prefix=/app --no-build-isolation pip pillow mutagen pypdf PySide6
      - install -dm755 /app/lib/metadata-studio
      - cp -r src/metadata_studio /app/lib/metadata-studio/metadata_studio
      - cp packaging/cli_main.py packaging/gui_main.py /app/lib/metadata-studio/
      - printf '#!/bin/sh\nexec python3 /app/lib/metadata-studio/cli_main.py "$@"\n' > /app/bin/metadata-studio
      - printf '#!/bin/sh\nexec python3 /app/lib/metadata-studio/gui_main.py "$@"\n' > /app/bin/metadata-studio-gui
      - chmod 755 /app/bin/metadata-studio /app/bin/metadata-studio-gui
      - install -Dm644 packaging/metadata-studio.desktop /app/share/applications/com.vanguardarts.MetadataStudio.desktop
      - install -Dm644 packaging/metadata-studio.svg /app/share/icons/hicolor/scalable/apps/com.vanguardarts.MetadataStudio.svg
      - install -Dm644 packaging/flatpak/com.vanguardarts.MetadataStudio.metainfo.xml /app/share/metainfo/com.vanguardarts.MetadataStudio.metainfo.xml
    sources:
      - type: git
        url: https://github.com/VanguardArts/metadata-studio.git
        tag: v0.1.0

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-studio"
version = "0.1.0"
description = "Metadata Studio — unified metadata inspection and sanitization. Inspect EXIF, ID3, C2PA and PDF/document metadata; detect hidden metadata and embedded thumbnails; batch-remove identifying information; compare before/after; batch processing and folder monitoring."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vanguard Arts SRL" }]
requires-python = ">=3.9"
keywords = ["metadata", "sanitization", "exif", "id3", "c2pa", "pdf", "provenance", "privacy", "gui"]
dependencies = [
    "Pillow>=9.0",
    "mutagen>=1.45",
    "pypdf>=3.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7", "PyYAML>=6.0"]

[project.scripts]
metadata-studio = "metadata_studio.cli:main"
metadata-studio-gui = "metadata_studio.gui.app:main"

[project.urls]
Homepage = "https://vanguardarts.vip/"
Support = "https://vanguardarts.vip/contact"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metadata_studio = ["gui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
